<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{ subject }}</title>
  </head>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111;">
    <p style="font-size: 16px; margin: 0 0 12px;">{{ body }}</p>
    {% if position %}
    <p style="font-size: 14px; color: #555; margin: 0 0 16px;">
      Queue position: <strong>#{{ position }}</strong>
    </p>
    {% endif %}
    {% if ticket_link %}
    <p style="margin: 24px 0 0;">
      <a
        href="{{ ticket_link }}"
        style="
          display: inline-block;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          padding: 10px 18px;
          border-radius: 8px;
          font-weight: 600;
        "
        >Open your ticket</a
      >
    </p>
    {% endif %}
    <p style="font-size: 12px; color: #888; margin-top: 32px;">
      {{ project_name }} — queue update
    </p>
  </body>
</html>
