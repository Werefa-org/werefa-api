<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Verification update</title>
  </head>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #111;">
    <p style="font-size: 16px; margin: 0 0 12px;">
      We could not approve <strong>{{ biz_name }}</strong> on {{ project_name }} yet.
    </p>
    <p style="font-size: 14px; color: #555; margin: 0 0 12px;">
      <strong>Reason:</strong> {{ reason }}
    </p>
    <p style="font-size: 14px; color: #555; margin: 0 0 16px;">
      Please upload corrected documents and contact support if you need help.
    </p>
    <p style="margin: 24px 0 0;">
      <a
        href="{{ documents_link }}"
        style="
          display: inline-block;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          padding: 10px 18px;
          border-radius: 8px;
          font-weight: 600;
        "
        >Upload documents</a
      >
    </p>
  </body>
</html>
